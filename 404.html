<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://pedrocunhabatista.github.io/">
  <meta http-equiv="refresh" content="0;url=https://pedrocunhabatista.github.io/">
  <title>Opening Pedro Batista's Portfolio</title>
  <script>
    (() => {
      const destination = 'https://pedrocunhabatista.github.io';
      const oldBase = '/pedro-batista-portfolio';
      let path = location.pathname.startsWith(oldBase)
        ? location.pathname.slice(oldBase.length)
        : location.pathname;
      if (!path || path === '/') path = '/';
      location.replace(`${destination}${path}${location.search}${location.hash}`);
    })();
  </script>
</head>
<body>
  <p>Opening <a href="https://pedrocunhabatista.github.io/">Pedro Batista's portfolio</a>&hellip;</p>
</body>
</html>
